apiVersion: v1alpha1
kind: Setting
metadata:
  name: ethereal-companion-setting
spec:
  forms:
    - group: recentComments
      label: 接口设置
      formSchema:
        - $formkit: number
          name: defaultSize
          label: 默认返回条数
          help: 请求未携带 size 参数（或参数非法）时返回的条数，1-50
          min: 1
          max: 50
          step: 1
          validation: required|min:1|max:50
          value: 5
        - $formkit: number
          name: maxSize
          label: 单次请求上限
          help: size 参数超过该值时按该值截断，防止 size=9999 之类的大查询拖垮站点，1-100
          min: 1
          max: 100
          step: 1
          validation: required|min:1|max:100
          value: 20
        - $formkit: number
          name: cacheSeconds
          label: 结果缓存秒数
          help: 聚合结果的服务端缓存时长（默认 60 秒，用于保护匿名访问），0 为禁用（实时查询）。新发表/新审核的评论在缓存过期后可见
          min: 0
          max: 3600
          step: 1
          validation: required|min:0|max:3600
          value: 60
        - $formkit: switch
          name: includePageComments
          label: 包含页面评论
          help: 开启后，聊天室 / 关于 / 留言等自定义页面的评论也会出现在「最近评论」里；默认关闭，只聚合文章评论
          value: false
        - $formkit: text
          name: excludeOwners
          label: 排除的用户
          help: 这些账号（用户名，多个用逗号分隔）发表的评论和回复不会出现在「最近评论」里。默认排除 AI 自动回复账号 ailqbby
          value: "ailqbby"
    - group: friendsRandom
      label: 随机友链
      formSchema:
        - $formkit: number
          name: defaultSize
          label: 默认返回条数
          help: 请求未携带 size 参数（或参数非法）时返回的条数，1-24
          min: 1
          max: 24
          step: 1
          validation: required|min:1|max:24
          value: 6
        - $formkit: number
          name: maxSize
          label: 单次请求上限
          help: size 参数超过该值时按该值截断，防止 size=9999 之类的大查询拖垮站点，1-100
          min: 1
          max: 100
          step: 1
          validation: required|min:1|max:100
          value: 24
        - $formkit: number
          name: cacheSeconds
          label: 候选列表缓存秒数
          help: 只缓存「全部友链的名单」，洗牌每次都重做，因此不影响随机性；0 为不缓存
          min: 0
          max: 3600
          step: 1
          validation: required|min:0|max:3600
          value: 60
